[pytest]
# testpaths, not the default rootdir-wide collection: steps/test_*.py only pass
# with a stack already launched, and test/test_*_bdd.py is what launches it
# (running them as a pytest subprocess). Without this, colcon's argument-less
# `python3 -m pytest` in this directory would also collect the step files bare -
# every scenario would run twice, once correctly through its harness and once
# with nothing up, and the bare run fails in `bsn_system`.
# Applies only when no path is given, so colcon's `--pytest-args test/x.py` and
# the harness' own inner run still select what they ask for.
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
