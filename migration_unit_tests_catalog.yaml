migration_notes_for_ros2_agent:
  - "Trocar rospy -> rclpy."
  - "Trocar rosservice/SetBool ROS1 por serviço equivalente ROS2 (mesmo .srv, adaptando client/server API)."
  - "Trocar roslaunch/rostest por launch_testing + pytest."
  - "Recriar fixtures de mock de serviço (patient_data e spo2) usando nós de teste ROS2."
  - "Manter mapeamento de tópicos e regras de risco exatamente iguais para regressão funcional."
  - "Validar timeouts e sincronização (ROS2 executor pode exigir spin/thread dedicados)."

gaps_or_attention_points:
  - "Nos testes *_connected, a descrição fala 'real sensor (spo2 service)' mesmo para sensores não-oxímetro; revisar se isso é intencional."
  - "Em G3T1_2..G3T1_6 connected, só há teste explícito de falha de serviço; considerar adicionar caso de sucesso também."
  - "test_G4T1.py foi recebido parcialmente (summarized), então o agente destino deve abrir arquivo completo para confirmar asserts finais."