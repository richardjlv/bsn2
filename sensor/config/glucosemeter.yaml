glucosemeter_node:
  ros__parameters:
    sensor: "glucosemeter"
    vital_sign: "glucose"
    frequency: "1.0"
    
    # Risk ranges as lists of floats
    HighRisk0: "20.0,39.99"
    MidRisk0: "40.0,54.99"
    LowRisk: "55.0,95.99"
    MidRisk1: "96.0,119.99"
    HighRisk1: "120.0,200.0"
    
    # Percentage-based risk scores
    lowrisk_percent: "0,20"
    midrisk_percent: "21,65"
    highrisk_percent: "66,100"

    battery_id: "glucose_battery"
    battery_capacity: 100.0
    battery_level: 100.0
    battery_unit: 0.05
    instant_recharge: false